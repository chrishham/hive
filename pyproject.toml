[project]
name = "hive"
version = "0.1.0"
description = "Claude Code session orchestrator TUI"
requires-python = ">=3.11"
dependencies = [
    "textual>=3.0",
    "tomli>=2.0; python_version < '3.12'",
]

[project.scripts]
hive = "hive.__main__:main"
hive-hook = "hive.hook_writer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hive"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]
