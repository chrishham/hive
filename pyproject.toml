[project]
name = "hive"
version = "0.2.0"
description = "Browser multiplexer for Claude Code sessions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "watchdog>=5.0",
    "textual>=3.0",
    "tomli>=2.0; python_version < '3.12'",
]

[project.scripts]
hive = "hive.__main__:main"
hive-legacy = "hive_legacy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hive", "src/hive_legacy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "httpx>=0.27",
]
